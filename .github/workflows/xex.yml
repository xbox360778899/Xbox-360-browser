name: Build XEX

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  xex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch xsdk
        run: git clone --depth 1 https://github.com/xenosworks/xsdk.git xsdk

      - name: Cache the powerpc-xsdk-elf toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-toolchain-${{ runner.os }}-${{ hashFiles('xsdk/tools/toolchain/build.sh') }}

      - name: Install toolchain build dependencies
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev wget curl python3 git

      - name: Build the powerpc-xsdk-elf toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: bash xsdk/tools/toolchain/build.sh
      - name: Build XSDK libraries
        run: |
          cmake -S xsdk -B xsdk/build \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/xsdk/cmake/xsdk.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build xsdk/build --parallel

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$PWD/xsdk/cmake/xsdk.cmake" -DCMAKE_BUILD_TYPE=Release
      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$PWD/xsdk/cmake/xsdk.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: xenon_ie-xex
          path: build/xenon_ie.xex
          if-no-files-found: error
