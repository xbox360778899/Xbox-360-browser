name: Build XEX

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  xex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch xsdk
        run: git clone --depth 1 https://github.com/xenosworks/xsdk.git xsdk

      - name: Cache the powerpc-xsdk-elf toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-toolchain-${{ runner.os }}-${{ hashFiles('xsdk/tools/toolchain/build.sh') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev wget curl python3 git \
            cmake ninja-build

      - name: Build the powerpc-xsdk-elf toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: bash xsdk/tools/toolchain/build.sh

      # ==========================================
      # YAHAN NAYA STEP ADD KIYA GAYA HAI (glslang)
      # ==========================================
      - name: Clone and Build glslang
        run: |
          git clone --depth 1 --branch xenon https://github.com/xenosworks/glslang-xenon.git glslang-xenon
          cd glslang-xenon
          python3 update_glslang_sources.py
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=ON -DSPIRV_SKIP_EXECUTABLES=ON -DGLSLANG_TESTS=OFF
          cmake --build build
          # Copy glslang to toolchain bin folder where xsdk expects it
          cp build/StandAlone/glslang ~/xsdk-gcc/bin/

      - name: Build XSDK libraries
        run: make -C xsdk -j"$(nproc)"

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$PWD/xsdk/cmake/xsdk.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: xenon_ie-xex
          path: build/xenon_ie.xex
          if-no-files-found: error
