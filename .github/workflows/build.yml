name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git texinfo flex bison wget libgmp-dev libmpfr-dev libmpc-dev libisl-dev
          sudo mkdir -p /usr/local/xenon && sudo chown -R $USER /usr/local/xenon
      - uses: actions/cache@v4
        id: tc
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-v1
      - name: Build toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          export DEVKITXENON=/usr/local/xenon
          ./build-xenon-toolchain toolchain
          ./build-xenon-toolchain libxenon
      - name: Build app
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:$DEVKITXENON/bin
          make
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-app
          path: "*.xex"
