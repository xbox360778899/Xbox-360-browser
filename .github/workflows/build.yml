name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git texinfo flex bison wget libgmp-dev libmpfr-dev libmpc-dev libisl-dev
          sudo mkdir -p /usr/local/xenon && sudo chown -R $USER /usr/local/xenon
      - uses: actions/cache@v4
        id: tc
        with:
          path: /usr/local/xenon
          key: xenon-toolchain-v1
      - name: Build toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Free60Project/libxenon.git
          cd libxenon/toolchain
          export DEVKITXENON=/usr/local/xenon
          ./build-xenon-toolchain toolchain
          ./build-xenon-toolchain libxenon
      - name: Build app
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH=$PATH:$DEVKITXENON/bin
          make
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-app
          path: "*.elf32"name: Build XEX

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  xex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache the powerpc-xsdk-elf toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-toolchain-${{ runner.os }}-${{ hashFiles('xsdk/tools/toolchain/build.sh') }}

      - name: Install toolchain build dependencies
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev wget curl python3 git

      - name: Build the powerpc-xsdk-elf toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: bash xsdk/tools/toolchain/build.sh

      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE="$PWD/xsdk/cmake/xsdk.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: xenon_ie-xex
          path: build/xenon_ie.xex
          if-no-files-found: error
          
